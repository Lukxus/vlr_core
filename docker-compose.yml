version: '3.9'

services:
  db:
    image: postgres:13.4  # Usar uma versão específica e estável
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data  # Mapeia o volume para uma pasta específica no host
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"  # Mapeia a porta 5432

volumes:
  postgres_data:
