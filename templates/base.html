<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Site{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header, footer {
            background-color: #1a1a1a;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .player-list {
            list-style-type: none;
            padding: 0;
        }
        .player-list li {
            background: #fff;
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        .player-list li b {
            font-size: 1.2em;
            color: #007BFF;
        }
        .player-list li img {
            border-radius: 50%;
            margin-right: 15px;
        }
        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
{% include 'commons/header.html' %}
<div class="container">
    {% block content %}
    {% endblock %}
</div>
{% include 'commons/footer.html' %}
</body>
</html>
