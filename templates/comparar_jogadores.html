<form method="get">
    <label for="nome_jogador1">Nome do Jogador 1:</label>
    <input type="text" id="nome_jogador1" name="nome_jogador1">

    <label for="nome_jogador2">Nome do Jogador 2:</label>
    <input type="text" id="nome_jogador2" name="nome_jogador2">

    <label for="agente">Agente:</label>
    <select id="agente" name="agente">
        <option value="">Todos</option>
        {% for agente in agentes %}
            <option value="{{ agente }}">{{ agente }}</option>
        {% endfor %}
    </select>

    <label for="tipo_atributo">Tipo de Atributo:</label>
    <select id="tipo_atributo" name="tipo_atributo">
        {% for tipo in tipos_atributos %}
            <option value="{{ tipo }}">{{ tipo }}</option>
        {% endfor %}
    </select>

    <button type="submit">Comparar</button>
</form>

{% if bokeh_script and bokeh_div %}
    {{ bokeh_script | safe }}
    {{ bokeh_div | safe }}
{% elif error_message %}
    <p>{{ error_message }}</p>
{% endif %}
